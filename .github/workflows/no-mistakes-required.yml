name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

# No paths / paths-ignore filter here, deliberately. The verdict is a function
# of the pull request body, not of the files it touches, so a path filter would
# silently drop the gate on exactly the pull requests whose bodies still need
# judging. That is the one intentional exception to the repo rule that every
# pull_request workflow excludes the release-please output set;
# test/release-ci-exclusions.test.ts encodes both halves.
on:
  pull_request:
    # no-mistakes #773 dropped synchronize because the pipeline pushed the head
    # before writing the body attestation, so a synchronize event pinned a
    # FAILURE check to the new head before the body was rewritten. Since
    # no-mistakes #994 the pipeline writes the attestation before it pushes, so
    # synchronize is the event that judges a pipeline-pushed head. T2 restores
    # it for that reason.
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    # Known automation accounts are exempt so automation keeps working:
    # - github-actions[bot] opens PRs via GITHUB_TOKEN, including every
    #   release-please release PR, so no structural release-please exemption is
    #   needed here any more.
    # - dependabot[bot] opens dependency update PRs.
    # Other authors (human or bot) must raise PRs through `git push no-mistakes`.
    #
    # These stay job-level rather than moving to the action's `exempt-authors`
    # input on purpose: an in-job exemption still requires the run to start, and
    # a GITHUB_TOKEN PR's run is created in action_required and never starts.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # The enforcement itself lives in the shared composite action in the
      # no-mistakes repository, so this repository no longer carries its own
      # copy of the script to drift.
      #
      # Pinned to an immutable commit, never @main: main is editable by the very
      # pull request this gate is judging. Bumping the pin is a separate,
      # deliberate pull request.
      - name: Verify no-mistakes signature and pipeline attestation in PR body
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@f6441c96c352a18b9cadcaef6b6c7017e9ac3970 # v1.80.1
